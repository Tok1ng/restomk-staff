<!DOCTYPE html>
<html lang="mk">

<head>
    <meta charset="UTF-8" />
    <title>RestoMK Staff</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #070d1f;
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        .login-screen {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(ellipse at 70% 30%, rgba(255, 90, 0, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 20% 80%, rgba(0, 80, 180, 0.2) 0%, transparent 50%),
                linear-gradient(135deg, #070d1f 0%, #0a1628 40%, #0d1f3c 100%);
        }

        .login-box {
            width: 420px;
            padding: 40px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo h1 {
            font-size: 36px;
            font-weight: 900;
            color: white;
        }

        .logo h1 .orange {
            background: linear-gradient(135deg, #ff6000, #ffaa00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo p {
            color: rgba(255, 255, 255, 0.5);
            margin-top: 8px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 14px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 6px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 15px;
            outline: none;
            font-family: 'Segoe UI', sans-serif;
        }

        .input-group input:focus {
            border-color: rgba(255, 100, 0, 0.5);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff5500, #ff9000, #ffb300);
            color: white;
            border: none;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            margin-top: 6px;
            box-shadow: 0 4px 20px rgba(255, 100, 0, 0.35);
            font-family: 'Segoe UI', sans-serif;
        }

        .error {
            padding: 12px 16px;
            border-radius: 10px;
            background: rgba(220, 38, 38, 0.15);
            color: #FCA5A5;
            border: 1px solid rgba(220, 38, 38, 0.3);
            font-size: 13px;
            margin-bottom: 14px;
        }

        .main-screen {
            display: none;
            height: 100vh;
            flex-direction: column;
        }

        .main-screen.active {
            display: flex;
        }

        .top-bar {
            padding: 12px 24px;
            background: rgba(10, 22, 40, 0.97);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .top-bar h2 {
            font-size: 16px;
            font-weight: 700;
        }

        .tabs {
            display: flex;
            gap: 8px;
        }

        .tab-btn {
            padding: 9px 20px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            position: relative;
            font-family: 'Segoe UI', sans-serif;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #ff5500, #ff9000);
            color: white;
            border: none;
        }

        .tab-btn .badge {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ef4444;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logout-btn {
            padding: 8px 16px;
            border-radius: 10px;
            background: rgba(220, 38, 38, 0.15);
            color: #FCA5A5;
            border: 1px solid rgba(220, 38, 38, 0.3);
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            font-family: 'Segoe UI', sans-serif;
        }

        #contentArea {
            flex: 1;
            overflow: hidden;
            display: flex;
        }

        @keyframes newOrder {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.01);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }
    </style>
</head>

<body>

    <!-- ЛОГИН -->
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <div class="logo">
                <h1>resto<span class="orange">MK</span></h1>
                <p>Staff Dashboard</p>
            </div>
            <div id="errorBox"></div>
            <div class="input-group">
                <label>📧 Email</label>
                <input type="email" id="email" placeholder="admin@restoran.mk"
                    onkeydown="if(event.key==='Enter') login()" />
            </div>
            <div class="input-group">
                <label>🔒 Лозинка</label>
                <input type="password" id="password" placeholder="••••••••"
                    onkeydown="if(event.key==='Enter') login()" />
            </div>
            <button class="login-btn" onclick="login()">🔑 Влези</button>
            <button class="login-btn" onclick="showRegister()"
                style="margin-top:10px;background:rgba(255,255,255,0.08);box-shadow:none;border:1px solid rgba(255,255,255,0.2);">
                🏪 Регистрирај ресторан
            </button>
        </div>
    </div>

    <!-- ГЛАВЕН ЕКРАН -->
    <div class="main-screen" id="mainScreen">
        <div class="top-bar">
            <h2 id="restaurantName">🏪 Ресторан</h2>
            <div class="tabs">
                <button class="tab-btn active" id="posTab" onclick="switchTab('pos')">
                    🛒 POS
                </button>
                <button class="tab-btn" id="kitchenTab" onclick="switchTab('kitchen')">
                    👨‍🍳 Кујна
                    <span class="badge" id="kitchenBadge" style="display:none">!</span>
                </button>
                <button class="tab-btn" id="adminTab" onclick="showAdminPin()">
                    ⚙️ Админ
                </button>
            </div>
            <button class="logout-btn" onclick="logout()">Одјави се</button>
        </div>
        <div id="contentArea"></div>
    </div>

    <script src="renderer.js"></script>
</body>

</html>
